# Nginx 配置示例 (NAS 部署)

server {
    listen 1024; # 对应您在 Lucky 中配置的监听端口
    server_name sounds.zhuyin.pro;

    # SSL 证书配置 (略)

    # 1. 静态素材映射 (可选，如果 Node.js 处理这部分则不需要)
    location /sources/ {
        alias /path/to/your/audio/sources/;
    }

    # 2. 混音合成 API 转发
    location /api/v1/synthesize {
        proxy_pass http://127.0.0.1:3000; # 假设 Node.js 容器在 3000 端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 延长合成请求的超时时间
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # 3. 临时混音文件访问
    location /temp/ {
        # 建议此处直接映射 Node.js 容器内的 temp 目录 (挂载在 RAM Disk 上)
        proxy_pass http://127.0.0.1:3000/temp/;
        
        # 开启缓存控制
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
